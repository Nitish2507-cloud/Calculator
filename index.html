<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Smart Calculator Pro X</title>

    <link
        rel="stylesheet"
        href="CSS/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- ==========================================
         LOADER
    =========================================== -->

    <div id="loader">

        <div class="loader-content">

            <div class="loader-circle"></div>

            <h2>
                Smart Calculator Pro X
            </h2>

        </div>

    </div>

    <!-- ==========================================
         BACKGROUND GRID
    =========================================== -->

    <div class="grid-bg"></div>

    <!-- ==========================================
         MAIN CONTAINER
    =========================================== -->

    <div class="container">

        <!-- ==========================================
             CALCULATOR
        =========================================== -->

        <div class="calculator">

            <!-- Header -->

            <div class="header">

                <div class="logo">

                    <i class="fa-solid fa-calculator"></i>

                    <span>
                        Smart Calculator Pro X
                    </span>

                </div>

                <div class="header-buttons">

                    <button id="scientificBtn">

                        <i class="fa-solid fa-flask"></i>

                    </button>

                    <button id="themeToggle">

                        <i class="fa-solid fa-bolt"></i>

                    </button>

                </div>

            </div>

            <!-- Display -->

            <div class="display-container">

                <input
                    type="text"
                    id="display"
                    readonly>

                <div id="liveResult">

                    0

                </div>

            </div>

            <!-- Calculator Buttons -->

            <div class="buttons">

                <button class="special" data-value="C">
                    C
                </button>

                <button class="special" data-value="DEL">
                    ⌫
                </button>

                <button class="special" data-value="%">
                    %
                </button>

                <button class="operator" data-value="/">
                    ÷
                </button>

                <button data-value="7">
                    7
                </button>

                <button data-value="8">
                    8
                </button>

                <button data-value="9">
                    9
                </button>

                <button class="operator" data-value="*">
                    ×
                </button>

                <button data-value="4">
                    4
                </button>

                <button data-value="5">
                    5
                </button>

                <button data-value="6">
                    6
                </button>

                <button class="operator" data-value="-">
                    −
                </button>

                <button data-value="1">
                    1
                </button>

                <button data-value="2">
                    2
                </button>

                <button data-value="3">
                    3
                </button>

                <button class="operator" data-value="+">
                    +
                </button>

                <button class="zero" data-value="0">
                    0
                </button>

                <button data-value=".">
                    .
                </button>

                <button class="equal" data-value="=">
                    =
                </button>

            </div>

            <!-- ==========================================
                 SCIENTIFIC PANEL
            =========================================== -->

            <div id="scientificPanel">

                <button data-func="sqrt">
                    √
                </button>

                <button data-func="square">
                    x²
                </button>

                <button data-func="sin">
                    sin
                </button>

                <button data-func="cos">
                    cos
                </button>

                <button data-func="tan">
                    tan
                </button>

            </div>

            <!-- ==========================================
                 ACTION BAR
            =========================================== -->

            <div class="action-bar">

                <button id="copyBtn">

                    <i class="fa-solid fa-copy"></i>

                    Copy Result

                </button>

                <button id="exportHistory">

                    <i class="fa-solid fa-file-export"></i>

                    Export History

                </button>

                <button id="clearHistory">

                    <i class="fa-solid fa-trash"></i>

                    Clear History

                </button>

            </div>

        </div>

        <!-- ==========================================
             HISTORY PANEL
        =========================================== -->

        <div class="history-panel">

            <h2>

                <i class="fa-solid fa-clock-rotate-left"></i>

                Calculation History

            </h2>

            <div id="historyList">

            </div>

        </div>

    </div>

    <script src="JS/script.js"></script>

</body>

</html>
